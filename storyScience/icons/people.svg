<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 统一风格的背景圆环 -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#e0e0e0" stroke-width="8"/>
  
  <!-- 人物头部 -->
  <circle cx="100" cy="65" r="20" fill="#4285f4" />
  
  <!-- 人物躯干 -->
  <path d="M100,85 L100,90 L85,120 L115,120 L100,90 Z" fill="#4285f4" />
  
  <!-- 人物手臂 -->
  <line x1="80" y1="95" x2="50" y2="110" stroke="#4285f4" stroke-width="8" stroke-linecap="round" />
  <line x1="120" y1="95" x2="150" y2="110" stroke="#4285f4" stroke-width="8" stroke-linecap="round" />
  
  <!-- 人物腿部 -->
  <line x1="90" y1="130" x2="75" y2="160" stroke="#4285f4" stroke-width="8" stroke-linecap="round" />
  <line x1="110" y1="130" x2="125" y2="160" stroke="#4285f4" stroke-width="8" stroke-linecap="round" />
  
  <!-- 面部细节 -->
  <circle cx="90" cy="60" r="3" fill="white" />
  <circle cx="110" cy="60" r="3" fill="white" />
  <path d="M90,70 Q100,75 110,70" stroke="white" stroke-width="2" fill="none" />
  
  <!-- 统一风格的装饰元素 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#fbbc05" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#34a853" stroke-width="2"/>
  
</svg>
