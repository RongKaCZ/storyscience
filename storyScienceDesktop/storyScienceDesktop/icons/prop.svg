<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景圆环 -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#e0e0e0" stroke-width="10"/>
  
  <!-- 齿轮轮廓 - 代表技能和机制 -->
  <g transform="translate(100, 100) scale(0.7)">
    <path d="M0,-60 L15,-30 L45,-30 L15,0 L60,0 L15,30 L45,60 L15,30 L0,60 L-15,30 L-45,60 L-15,30 L-60,0 L-15,0 L-45,-30 L-15,-30 Z" 
          fill="#4285f4" opacity="0.8"/>
    <circle cx="0" cy="0" r="20" fill="#4285f4"/>
  </g>
  
  <!-- 向上箭头 - 代表能力提升 -->
  <path d="M100,40 L120,80 L110,80 L110,120 L90,120 L90,80 L80,80 Z" 
        fill="#ea4335"/>
  
  <!-- 装饰元素 - 表示能量和影响 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#fbbc05" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#34a853" stroke-width="2"/>
</svg>
